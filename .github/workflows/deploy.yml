name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  # ⚠️ REMPLACEZ CES VALEURS PAR CELLES DE VOTRE PROJET GOOGLE CLOUD
  PROJECT_ID: your-gcp-project-id
  SERVICE_NAME: beecarbonat-app
  REGION: europe-west2 # Correspond à la région de votre infrastructure actuelle

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Authentification via Google Cloud Credentials (Secret GitHub)
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Configuration de Docker pour pousser vers Google Container Registry / Artifact Registry
      - name: Authorize Docker push
        run: gcloud auth configure-docker

      # Build & Push de l'image Docker multi-stage
      - name: Build and Push Container
        run: |-
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Déploiement sur Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--port=3000 --allow-unauthenticated'
