name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Exécution automatique tous les dimanches à minuit
  workflow_dispatch: # Permet de déclencher le scan manuellement depuis l'interface GitHub

jobs:
  dependency-audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      # L'installation avec --ignore-scripts prévient l'exécution de code malveillant post-install lors de l'audit
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # L'audit échouera (et bloquera la PR) uniquement si des vulnérabilités "high" ou "critical" sont détectées
      - name: Run npm audit
        run: npm audit --audit-level=high
